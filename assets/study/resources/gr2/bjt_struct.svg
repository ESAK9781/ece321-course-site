<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="560" height="270" role="img" aria-label="npn transistor: heavily doped emitter, thin base, lightly doped collector"><style>text{font-family:"Segoe UI",Inter,Arial,sans-serif;fill:#c9d2de;font-size:13px}.b{font-weight:600;fill:#e8edf4}.h{fill:#ff8f5a}.s{fill:#6cc7ff}</style><rect x="40" y="56" width="170" height="90" fill="none" stroke="#e8edf4" stroke-width="2"/><text x="125" y="99" text-anchor="middle" class="b">N  emitter</text><text x="125" y="119" text-anchor="middle" font-size="12">heavy doping</text><rect x="210" y="56" width="60" height="90" fill="none" stroke="#e8edf4" stroke-width="2"/><text x="240" y="99" text-anchor="middle" class="b">P  base</text><text x="240" y="119" text-anchor="middle" font-size="12">thin, light</text><rect x="270" y="56" width="250" height="90" fill="none" stroke="#e8edf4" stroke-width="2"/><text x="395" y="99" text-anchor="middle" class="b">N  collector</text><text x="395" y="119" text-anchor="middle" font-size="12">light doping</text><text x="210" y="180" text-anchor="middle">EBJ</text><line x1="210" y1="146" x2="210" y2="154" stroke="#c9d2de"/><text x="270" y="180" text-anchor="middle">CBJ</text><line x1="270" y1="146" x2="270" y2="154" stroke="#c9d2de"/><line x1="120" y1="208" x2="400" y2="208" stroke="#6cc7ff" stroke-width="3"/><polygon points="400,201 414,208 400,215" fill="#6cc7ff"/><text x="260" y="232" text-anchor="middle" class="s">most electrons cross the thin base to the collector (i_C)</text><line x1="80" y1="56" x2="80" y2="38" stroke="#e8edf4" stroke-width="2"/><line x1="240" y1="56" x2="240" y2="38" stroke="#e8edf4" stroke-width="2"/><line x1="440" y1="56" x2="440" y2="38" stroke="#e8edf4" stroke-width="2"/><text x="80" y="32" text-anchor="middle" class="b">E</text><text x="240" y="32" text-anchor="middle" class="b">B</text><text x="440" y="32" text-anchor="middle" class="b">C</text><text x="262" y="32" font-size="12" class="h">small i_B</text></svg>