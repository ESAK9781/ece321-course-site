<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Table of amplifier parameters: input resistance, open-circuit gain and output resistance for CS, partially bypassed CS, CD and CG stages"><style>text{font-family:"Segoe UI",Inter,Arial,sans-serif;fill:#c9d2de;font-size:13px}.b{font-weight:600;fill:#e8edf4}.h{fill:#ff8f5a}.s{fill:#6cc7ff}</style><rect x="8" y="10" width="624" height="36" fill="#1a2230" stroke="#c9d2de" stroke-width="1"/><text x="18" y="33" class="b" style="font-size:15px">Stage</text><text x="170" y="33" class="b" style="font-size:15px">Ri</text><text x="330" y="33" class="b" style="font-size:15px">Avo</text><text x="530" y="33" class="b" style="font-size:15px">Ro</text><rect x="8" y="46" width="624" height="36" fill="none" stroke="#c9d2de" stroke-width="1"/><text x="18" y="69" class="b" style="font-size:15px">CS, no RS</text><text x="170" y="69" class="" style="font-size:15px">RG1 ∥ RG2</text><text x="330" y="69" class="" style="font-size:15px">− gm·RD</text><text x="530" y="69" class="" style="font-size:15px">RD ∥ ro</text><rect x="8" y="82" width="624" height="36" fill="none" stroke="#c9d2de" stroke-width="1"/><text x="18" y="105" class="b" style="font-size:15px">CS, partial RS</text><text x="170" y="105" class="" style="font-size:15px">RG1 ∥ RG2</text><text x="330" y="105" class="" style="font-size:15px">− gm·RD / (1 + gm·RS1)</text><text x="530" y="105" class="" style="font-size:15px">≈ RD</text><rect x="8" y="118" width="624" height="36" fill="none" stroke="#c9d2de" stroke-width="1"/><text x="18" y="141" class="b" style="font-size:15px">CD</text><text x="170" y="141" class="" style="font-size:15px">RG1 ∥ RG2</text><text x="330" y="141" class="" style="font-size:15px">gm·RS / (1 + gm·RS)</text><text x="530" y="141" class="" style="font-size:15px">RS ∥ 1/gm</text><rect x="8" y="154" width="624" height="36" fill="none" stroke="#c9d2de" stroke-width="1"/><text x="18" y="177" class="b" style="font-size:15px">CG</text><text x="170" y="177" class="" style="font-size:15px">RS ∥ 1/gm</text><text x="330" y="177" class="" style="font-size:15px">+ gm·RD</text><text x="530" y="177" class="" style="font-size:15px">RD ∥ ro</text><line x1="160" y1="10" x2="160" y2="190" stroke="#c9d2de"/><line x1="320" y1="10" x2="320" y2="190" stroke="#c9d2de"/><line x1="520" y1="10" x2="520" y2="190" stroke="#c9d2de"/></svg>